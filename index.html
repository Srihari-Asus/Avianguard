<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AvianGuard - Premium AI Agricultural Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['selector', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: 'var(--primary)',
              light: 'var(--primary-light)',
              hover: 'var(--primary-hover)',
            },
            main: 'var(--text-main)',
            muted: 'var(--text-muted)',
            app: 'var(--bg-app)',
            card: 'var(--bg-card)',
            sidebar: 'var(--bg-sidebar)',
            soft: 'var(--border-soft)',
            light: 'var(--border-light)',
            'accent-neon': 'var(--accent-neon)',
          }
        }
      }
    }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
  <style>
    /* Base overrides for zero-flicker theme */
    :root {
      background-color: #fdfcf9;
    }

    [data-theme='dark'] {
      background-color: #0c0a09;
    }

    .no-transition * {
      transition: none !important;
    }
  </style>
  <script type="importmap">

  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

</html>
